apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'de.infonline.sampleapp'

    compileSdkVersion 35

    defaultConfig {
        applicationId "de.infonline.sampleapp"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.1.2'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }

    flavorDimensions.add("endpoint")

    productFlavors {
        dev {
            dimension "endpoint"
        }

        prod {
            dimension "endpoint"
        }
    }
}

repositories {
    maven {
        url = uri("https://maven.pkg.github.com/INFOnline-sg/gitlab-archive-tec-app-libraries-iomb_iomp_android")
        name = "GitHubPackages"
        credentials {
            // add gpr.user and gpr.token to global gradle.properties (~/.gradle/gradle.properties) or set environment variables
            username = project.findProperty("gpr.user") as String ?: System.getenv("GITHUB_USERNAME")
            password = project.findProperty("gpr.token") as String ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'de.infonline:iomb-library-staging:1.1.3-staging-1160-21d4aeb7'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxkotlin:3.0.1'
}
