name: Publish IOMb library to GitHub Packages

# Manual-only release workflow. Source lives in the (frozen, read-only)
# archive repo `INFOnline-sg/gitlab-archive-tec-app-libraries-iomb_iomp_android`;
# this workflow checks out a fixed tag/commit, builds the AAR with the
# original AGP 4 / JDK 8 toolchain, and publishes to this repo's GitHub
# Packages Maven registry. No auto-trigger by design.

on:
  workflow_dispatch:
    inputs:
      archive_ref:
        description: 'Tag or commit SHA in the archive repo to build.'
        required: true
        type: string
        default: '211014_IOMbLib_Release_1.0.0'
      version_name:
        description: 'Optional override for the published Maven version. Leave empty to use the archive''s globalVersionName (1.0.0).'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: distribution

      - name: Diag — secret sanity
        env:
          TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "ARCHIVE_READ_TOKEN is empty/unavailable"; exit 1; }
          echo "ARCHIVE_READ_TOKEN length=${#TOKEN}"

      - name: Diag — repo auth probe
        env:
          TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/INFOnline-sg/gitlab-archive-tec-app-libraries-iomb_iomp_android)
          echo "archive repo auth probe HTTP $code"

      - name: Checkout archive
        uses: actions/checkout@v4
        with:
          repository: INFOnline-sg/gitlab-archive-tec-app-libraries-iomb_iomp_android
          ref: ${{ inputs.archive_ref }}
          token: ${{ secrets.ARCHIVE_READ_TOKEN }}
          path: archive
          fetch-depth: 0

      - name: Patch archive buildscript repos
        working-directory: archive
        run: |
          # 1. `com.github.jcandksolutions.gradle:android-unit-test:2.1.1` is on
          #    the buildscript classpath but never applied, and only ever
          #    existed on JCenter (offline since 2022). Drop the line so
          #    buildscript resolution succeeds.
          sed -i "/com\.github\.jcandksolutions\.gradle:android-unit-test/d" build.gradle

          # 2. The buildscript classpath needs Maven Central for dependencies
          #    that aren't on jcenter (dead) / google() / the Gradle Plugin
          #    Portal. Inject mavenCentral() into the buildscript block on the
          #    runner. (Init-script approaches in publish-override.gradle don't
          #    catch root's buildscript classpath resolution in time on Gradle
          #    6.8.3, so we patch deterministically here instead.)
          sed -i '/^buildscript {/,/^}$/ s|^        jcenter()$|        jcenter()\n        mavenCentral()|' build.gradle

          # 3. Remove the `org.ajoberstar.git-publish` plugin completely. Its
          #    `org.ajoberstar.grgit:grgit-core:latest.release` transitive dep
          #    today resolves to 5.3.3, which requires JDK 11. The archive
          #    needs JDK 8 (AGP 4.0.2 hard requirement), so the consumer/
          #    producer Java versions don't match and resolution fails.
          #    The plugin is only used by the `gitPublishPush` task that
          #    publishes to a separate Git remote — irrelevant to this AAR
          #    publish workflow. Strip the classpath dep, the `apply plugin:`
          #    line, and the `gitPublish { ... }` configuration block.
          sed -i "/'org\.ajoberstar:gradle-git-publish:3\.0\.0'/d" build.gradle
          sed -i "/^apply plugin: 'org\.ajoberstar\.git-publish'$/d" build.gradle
          sed -i '/^gitPublish {/,/^}$/d' build.gradle

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The archive's `gradle/wrapper/gradle-wrapper.jar` is a custom-built
          # variant whose SHA-256 is not in Gradle's official release-checksum
          # database (a sibling JAR under `public-components/gradle/wrapper/`
          # in the same archive IS official, so the divergence is historical
          # within Rockabyte's old build setup). The archive is frozen and
          # internally trusted, so wrapper validation does not add meaningful
          # supply-chain protection here. Validation stays implicitly active
          # for any non-archive workspace files.
          validate-wrappers: false

      - name: Build and publish library AAR
        working-directory: archive
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REPO_URL: https://maven.pkg.github.com/${{ github.repository }}
          VERSION_NAME_OVERRIDE: ${{ inputs.version_name }}
        run: |
          ./gradlew \
            --init-script ${{ github.workspace }}/distribution/.github/gradle/publish-override.gradle \
            :library:assembleProdRelease \
            :library:publishLibraryPublicationToGitHubPackagesRepository

      - name: Upload AAR as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iomb-library-aar
          path: archive/library/build/outputs/aar/*.aar
          if-no-files-found: warn
